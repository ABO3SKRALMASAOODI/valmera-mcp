<script>
  const audio = document.querySelector('#sample');
  const result = document.querySelector('#result');
  const download = document.querySelector('#download');
  const sounds = JSON.parse(document.querySelector('#embedded-samples').textContent);
  const descriptions = {
    original: 'The host says "Right, thank you" over the start of the guest\'s device condition.',
    'mixed-mute': 'Muting the combined track removes the host and the start of the device condition.',
    'host-only': 'Muting the host track leaves the device condition intact in the guest track.'
  };
  let url = '';
  let position = 0;

  function switchMix(name) {
    if (audio.readyState > 0) position = audio.currentTime;
    audio.pause();
    const bytes = Uint8Array.from(atob(sounds[name].join('')), character => character.charCodeAt(0));
    const nextUrl = URL.createObjectURL(new Blob([bytes], { type: 'audio/mp4' }));
    audio.src = nextUrl;
    if (url) URL.revokeObjectURL(url);
    url = nextUrl;
    download.href = url;
    download.download = `${name}.m4a`;
    result.textContent = descriptions[name];
  }

  audio.addEventListener('loadedmetadata', () => {
    audio.currentTime = Math.min(position, audio.duration);
  });
  document.querySelector('#mixes').addEventListener('change', event => switchMix(event.target.value));
  document.querySelector('#listen').addEventListener('click', async () => {
    position = 4.9;
    if (audio.readyState > 0) audio.currentTime = position;
    try {
      await audio.play();
    } catch {
      result.textContent = 'Use the audio player to start listening.';
    }
  });
  switchMix('original');
</script>
