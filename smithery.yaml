# Smithery listing for the Valmera MCP server.
# https://smithery.ai/docs
#
# Valmera is hosted, not self-run: there is nothing to install and no API key to
# paste. The connector authenticates with OAuth 2.1 (dynamic client registration
# + PKCE), so the client is handed a sign-in page rather than a config field.

startCommand:
  type: http
  url: https://entrepreneur-bot-backend.onrender.com/mcp

name: valmera
displayName: Valmera — Agentic AI Video Editor
description: >-
  Edit real video from the conversation. Cut silences and filler words, add
  word-timed captions, reframe to 9:16 for TikTok, splice b-roll, score and
  master the audio, then export a full-quality MP4 cut from your original file.
  110 tools operating on an edit decision list — nothing is destructive and the
  upload is never modified. Not a text-to-video generator; it edits footage you
  already have.

homepage: https://valmera.io/mcp
repository: https://github.com/ABO3SKRALMASAOODI/valmera-mcp
documentation: https://valmera.io/mcp/tools
license: MIT

icon: https://valmera.io/icon-512.png

categories:
  - media
  - video
  - productivity
  - content-creation

tags:
  - video-editing
  - agentic-video-editor
  - ai-video-editor
  - captions
  - subtitles
  - transcription
  - ffmpeg
  - podcast
  - shorts
  - tiktok
  - youtube
  - reframe
  - b-roll
  - audio-mastering

auth:
  type: oauth
  note: >-
    OAuth 2.1 with dynamic client registration and PKCE — the client opens a
    Valmera sign-in page and no token is ever copied by hand. Clients without
    OAuth support can instead send `Authorization: Bearer vlm_mcp_...` using a
    token minted at https://valmera.io/mcp.

examples:
  - prompt: Cut the dead air and the ums from this podcast, then caption it.
    description: cut_silences → remove_filler_words → add_captions, captions timed against the new edit rather than the raw recording
  - prompt: Make this vertical for TikTok and keep the speaker centred.
    description: auto_reframe measures the frame before cropping, then rescales captions to the new aspect
  - prompt: Find the strongest 45 seconds and give me just that, with music.
    description: reads the transcript, keeps the span, scores it and ducks the music under speech
  - prompt: Blur the license plate whenever it's visible.
    description: blur_region follows the footage through later cuts and reframes
